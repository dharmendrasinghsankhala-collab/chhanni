<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chhanni</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="logo.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside id="side">
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffbe5c"/><stop offset="1" stop-color="#e8892a"/></linearGradient></defs>
      <rect x="2" y="2" width="60" height="60" rx="16" fill="#1c2029"/>
      <path d="M12 20h40l-9 26a6 6 0 0 1-5.7 4H26.7A6 6 0 0 1 21 46z" fill="url(#lg)"/>
      <g stroke="#1a1206" stroke-width="2.2" stroke-linecap="round" opacity=".75"><path d="M22 28h20M24 34h16M26 40h12"/><path d="M28 22v22M36 22v22"/></g>
      <rect x="26" y="52" width="4" height="4" rx="1" fill="#3fb168"/><rect x="34" y="54" width="4" height="4" rx="1" fill="#3d8bfd"/></svg>
    <div><b>Chhanni</b><span>Footage QC &amp; Selects</span></div>
  </div>
  <nav class="nav" id="nav">
    <a data-r="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg>Projects</a>
    <a data-r="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>New project</a>
    <div class="navlabel" id="navproj">No project open</div>
    <a data-r="run" class="dis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4zM9 8l7 4-7 4z"/></svg>Analyze</a>
    <a data-r="review" class="dis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="8" height="6" rx="1"/><rect x="13" y="5" width="8" height="6" rx="1"/><rect x="3" y="13" width="8" height="6" rx="1"/><rect x="13" y="13" width="8" height="6" rx="1"/></svg>Review selects</a>
    <a data-r="assemble" class="dis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h12M3 18h7"/><path d="M17 15l4 3-4 3z" fill="currentColor"/></svg>Script &amp; assemble</a>
    <a data-r="export" class="dis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>Send to NLE</a>
    <div class="navlabel">Settings</div>
    <a data-r="ai"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2.2 4.6L19 9l-3.5 3.4.8 4.9L12 15l-4.3 2.3.8-4.9L5 9l4.8-1.4z"/></svg>Settings &amp; updates</a>
  </nav>
  <div class="side-foot">
    <div id="minirun"></div>
    <div class="row"><span class="chip" id="gpuchip"><i></i>GPU…</span></div>
    <span id="ver" class="small"></span>
  </div>
</aside>
<main id="main"></main>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
